// Shared Compose stability configuration (M-11, phase-6 item 12).
//
// Wired by the composekit.kmp.compose convention plugin via
// composeCompiler { stabilityConfigurationFiles.add(...) } on the
// ComposeCompilerGradlePluginExtension:
// https://kotlinlang.org/api/kotlin-gradle-plugin/compose-compiler-gradle-plugin/org.jetbrains.kotlin.compose.compiler.gradle/-compose-compiler-gradle-plugin-extension/
// Domain-model packages are stable by declaration here instead of by a
// UI wrapper. kotlin.collections.* makes read-only stdlib collections
// compare by equals (see the compose-ui skill, rule 4).
//
// At bootstrap time, replace __BASE_PACKAGE__ with the project's
// BASE_PACKAGE (see .composekit.conf) and keep one line per module that
// owns domain models, using single-segment wildcards only.
//
// List a package only when every class in it is immutable; check this file
// whenever adding a model class. Mutable classes must not be declared stable.
__BASE_PACKAGE__.feature.*.domain.model.*
__BASE_PACKAGE__.data.*.domain.model.*
kotlin.collections.*
