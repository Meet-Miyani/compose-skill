name: composekit guards

# The guard job calls the run-checks.sh registry (SKILL.md rule 10),
# never individual check scripts. Shape follows the official JetBrains
# KMP-App-Template workflows (checkout plus JDK setup, then Gradle).
on:
  push:
    branches:
      - main
  pull_request:

jobs:
  guards:
    name: Guards
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 21
      - name: composekit guards
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -n "$PR_BASE" ]; then
            bash scripts/composekit/run-checks.sh . --base "$PR_BASE"
          else
            bash scripts/composekit/run-checks.sh .
          fi
