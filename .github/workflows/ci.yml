name: ci

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Validate skill
        run: ./scripts/validate-skill.sh --quick --score-only

      - name: Test
        run: go test ./...

      - name: Smoke test
        run: ./scripts/smoke-test.sh
