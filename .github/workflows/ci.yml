name: ci

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Test architecture guards
        run: bash tests/skills/compose-architecture/run-tests.sh

      - name: Validate plugin manifests
        run: python3 scripts/validate-plugin-manifests.py

      - name: Validate skills
        # Plain logs, no annotations: the known warnings (no per-skill README,
        # sourced lib files) are by design. Errors still fail the step.
        env:
          CI: "false"
          NO_COLOR: "1"
        run: |
          status=0
          for skill in skills/*/; do
            ./scripts/validate-skill.sh "$skill" || status=1
          done
          exit $status
