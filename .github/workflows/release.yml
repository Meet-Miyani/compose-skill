name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Package skills bundle
        run: bash scripts/package-skills.sh "${GITHUB_REF_NAME}"

      - name: Generate checksum
        run: |
          cd dist
          sha256sum "compose-kit-skills_${GITHUB_REF_NAME}.tar.gz" > checksums.txt

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_flags=()
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
            release_flags+=(--prerelease)
          fi
          gh release create "${GITHUB_REF_NAME}" \
            "dist/compose-kit-skills_${GITHUB_REF_NAME}.tar.gz" \
            dist/checksums.txt \
            --generate-notes "${release_flags[@]}"
